<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script>
/* =========================================================
   ✏️  EDITA SOLO ESTA PARTE
   ========================================================= */
const REGALO = {
  de: "Mateo",
  para: "Nombre de ella/él",
  // Fecha en que empezaron (AAAA-MM-DDTHH:MM)
  fecha: "2024-02-14T20:00",
  // 3 fotos para la portada (súbelas a la carpeta /fotos)
  fotosPortada: ["fotos/1.jpg", "fotos/2.jpg", "fotos/3.jpg"],
  // La carta. Respeta los saltos de línea.
  carta: `Mi amor:
 
Aquí va tu carta. Escribe lo que sientes, lo que recuerdas de ese primer día, lo que te hace reír de nosotros y lo que sueñas para lo que viene.
 
No tiene que ser perfecta. Tiene que ser tuya.
 
Te quiero,`,
  firma: "Mateo",
  fotoFinal: "fotos/final.jpg",
  fraseFinal: "Y esto apenas empieza.",
  // Canción opcional (archivo .mp3 en la misma carpeta). Deja "" si no quieres música.
  cancion: "cancion.mp3"
};
/* ========================================================= */
</script>
<style>
:root{
  --bg:#fbf6f1; --ink:#3a2a2a; --soft:#8a6f6a; --rose:#b5485d; --rose-2:#e8b4b8;
  --paper:#fffdf9; --line:rgba(58,42,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.script{font-family:"Great Vibes",cursive}
 
/* ---------- Sobre de entrada ---------- */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at top,#f6e3df,#ecd2cc 60%,#e2c0b9);transition:opacity 1s ease,visibility 1s}
#intro.gone{opacity:0;visibility:hidden}
.intro-wrap{text-align:center;padding:24px}
.intro-to{font-size:15px;letter-spacing:.25em;text-transform:uppercase;color:var(--soft);margin-bottom:28px}
.intro-to b{display:block;font-family:"Great Vibes",cursive;font-size:46px;letter-spacing:0;text-transform:none;color:var(--rose);font-weight:400;margin-top:6px}
.envelope{position:relative;width:280px;height:180px;margin:0 auto;cursor:pointer;perspective:800px}
.env-back{position:absolute;inset:0;background:#d99a9f;border-radius:6px;box-shadow:0 20px 40px rgba(120,50,60,.25)}
.env-letter{position:absolute;left:14px;right:14px;top:14px;height:150px;background:var(--paper);border-radius:4px;transition:transform 1s cubic-bezier(.2,.8,.2,1) .5s;display:grid;place-items:center;font-family:"Great Vibes",cursive;font-size:30px;color:var(--rose)}
.env-front{position:absolute;inset:0;border-radius:6px;background:
  linear-gradient(to top right,#e3aeb2 50%,transparent 50%) left/50% 100% no-repeat,
  linear-gradient(to top left,#e3aeb2 50%,transparent 50%) right/50% 100% no-repeat;z-index:2}
.env-flap{position:absolute;left:0;right:0;top:0;height:100px;transform-origin:top;z-index:3;transition:transform .7s ease,z-index 0s .35s}
.env-flap::before{content:"";position:absolute;inset:0;background:#cf8a90;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:78px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d4566c,#8f2a3c);z-index:4;display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:opacity .3s}
.envelope.open .seal{opacity:0}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .env-letter{transform:translateY(-90px)}
.tap{margin-top:34px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
 
/* ---------- Secciones ---------- */
section{min-height:100svh;padding:72px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.kicker{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-bottom:18px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1.1s ease,transform 1.1s ease}
.reveal.in{opacity:1;transform:none}
 
/* Portada */
.polaroids{position:relative;width:min(340px,86vw);height:min(400px,100vw);margin:8px auto 36px}
.pol{position:absolute;width:62%;background:#fff;padding:10px 10px 34px;box-shadow:0 14px 30px rgba(70,30,30,.18);border-radius:2px}
.pol .ph{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:linear-gradient(135deg,#f0d5d1,#e2b9b4)}
.pol:nth-child(1){left:0;top:6%;transform:rotate(-8deg)}
.pol:nth-child(2){right:0;top:0;transform:rotate(7deg)}
.pol:nth-child(3){left:19%;top:34%;transform:rotate(-1deg);z-index:2}
.names{font-family:"Great Vibes",cursive;font-size:clamp(48px,13vw,76px);color:var(--rose);line-height:1.05;font-weight:400}
.names .amp{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.55em;color:var(--soft);margin:0 .15em}
.since{font-family:"Cormorant Garamond",serif;font-size:20px;font-style:italic;color:var(--soft);margin-top:10px}
.scroll-hint{position:absolute;bottom:26px;font-size:22px;color:var(--rose-2);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
 
/* Contador */
#contador{background:linear-gradient(180deg,var(--bg),#f4e4df)}
.counter-title{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,8vw,44px);font-weight:400;margin-bottom:34px;line-height:1.2}
.counter-title em{color:var(--rose)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(420px,100%)}
.cell{background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:14px;padding:18px 6px 14px;backdrop-filter:blur(4px)}
.num{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,10vw,46px);font-weight:600;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:8px}
.counter-foot{margin-top:28px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;color:var(--soft)}
.heartbeat{display:inline-block;color:var(--rose);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
 
/* Carta */
.letter{width:min(560px,100%);background:var(--paper);padding:44px 30px 40px;border-radius:4px;box-shadow:0 20px 50px rgba(90,40,40,.12);text-align:left;position:relative;background-image:repeating-linear-gradient(transparent 0 33px,rgba(181,72,93,.07) 33px 34px)}
.letter::before{content:"";position:absolute;left:22px;top:0;bottom:0;border-left:1px solid rgba(181,72,93,.18)}
.letter-body{font-family:"Cormorant Garamond",serif;font-size:21px;line-height:34px;white-space:pre-line;padding-left:12px;min-height:200px}
.letter-sign{font-family:"Great Vibes",cursive;font-size:40px;color:var(--rose);text-align:right;margin-top:16px;opacity:0;transition:opacity 1.5s}
.letter-sign.in{opacity:1}
.caret{display:inline-block;width:1px;height:20px;background:var(--rose);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
 
/* Final */
#final{background:linear-gradient(180deg,#f4e4df,#ead0ca)}
.final-photo{width:min(380px,88vw);aspect-ratio:4/5;object-fit:cover;border-radius:200px 200px 16px 16px;box-shadow:0 24px 60px rgba(90,40,40,.25);background:linear-gradient(135deg,#f0d5d1,#e2b9b4);display:block}
.final-text{font-family:"Great Vibes",cursive;font-size:clamp(40px,11vw,60px);color:var(--rose);margin-top:34px;line-height:1.1}
.final-from{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-top:18px}
 
/* Música */
#music{position:fixed;right:16px;bottom:16px;z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(6px);color:var(--rose);font-size:18px;cursor:pointer;display:none;box-shadow:0 6px 18px rgba(0,0,0,.08)}
#music.show{display:grid;place-items:center}
#music.playing{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
 
/* Pétalos */
.petal{position:fixed;top:-20px;z-index:1;pointer-events:none;width:12px;height:12px;background:var(--rose-2);border-radius:12px 0 12px 0;opacity:.55;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="locked">
 
<div id="intro">
  <div class="intro-wrap">
    <p class="intro-to">Para<b id="introName"></b></p>
    <div class="envelope" id="envelope" role="button" aria-label="Abrir sobre">
      <div class="env-back"></div>
      <div class="env-letter">♥</div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">♥</div>
    </div>
    <p class="tap">Toca para abrir</p>
  </div>
</div>
 
<button id="music" aria-label="Música">♫</button>
 
<main>
  <section id="portada">
    <div class="polaroids reveal" id="polaroids"></div>
    <h1 class="names reveal" id="names"></h1>
    <p class="since reveal" id="since"></p>
    <div class="scroll-hint">⌄</div>
  </section>
 
  <section id="contador">
    <p class="kicker reveal">Nuestro tiempo</p>
    <h2 class="counter-title reveal">Llevamos juntos<br><em>cada segundo cuenta</em></h2>
    <div class="grid reveal">
      <div class="cell"><div class="num" id="y">0</div><div class="lbl">Años</div></div>
      <div class="cell"><div class="num" id="mo">0</div><div class="lbl">Meses</div></div>
      <div class="cell"><div class="num" id="d">0</div><div class="lbl">Días</div></div>
      <div class="cell"><div class="num" id="h">0</div><div class="lbl">Horas</div></div>
      <div class="cell"><div class="num" id="mi">0</div><div class="lbl">Minutos</div></div>
      <div class="cell"><div class="num" id="s">0</div><div class="lbl">Segundos</div></div>
    </div>
    <p class="counter-foot reveal">y sigue contando <span class="heartbeat">♥</span></p>
  </section>
 
  <section id="carta">
    <p class="kicker reveal">Una carta para ti</p>
    <div class="letter reveal">
      <div class="letter-body" id="letterBody"></div>
      <div class="letter-sign" id="letterSign"></div>
    </div>
  </section>
 
  <section id="final">
    <img class="final-photo reveal" id="finalPhoto" alt="">
    <p class="final-text reveal" id="finalText"></p>
    <p class="final-from reveal" id="finalFrom"></p>
  </section>
</main>
 
<audio id="audio" loop preload="auto"></audio>
 
<script>
const $ = id => document.getElementById(id);
const R = REGALO;
 
/* Contenido */
document.title = "Para " + R.para;
$("introName").textContent = R.para;
$("names").innerHTML = `${R.de}<span class="amp">&amp;</span>${R.para}`;
const start = new Date(R.fecha);
$("since").textContent = "Desde el " + start.toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"});
$("polaroids").innerHTML = R.fotosPortada.slice(0,3).map(src =>
  `<div class="pol"><img class="ph" src="${src}" alt="" onerror="this.onerror=null;this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='"></div>`).join("");
$("finalPhoto").src = R.fotoFinal;
$("finalPhoto").onerror = function(){ this.onerror=null; this.src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="; };
$("finalText").textContent = R.fraseFinal;
$("finalFrom").textContent = "Con amor, " + R.de;
$("letterSign").textContent = R.firma;
 
/* Contador */
function tick(){
  const now = new Date();
  if (now < start) return;
  let a = new Date(start), y = 0, m = 0;
  while (true){ const t = new Date(a); t.setFullYear(t.getFullYear()+1); if (t <= now){ a = t; y++; } else break; }
  while (true){ const t = new Date(a); t.setMonth(t.getMonth()+1); if (t <= now){ a = t; m++; } else break; }
  let rest = Math.floor((now - a) / 1000);
  const d = Math.floor(rest / 86400); rest %= 86400;
  const h = Math.floor(rest / 3600); rest %= 3600;
  const mi = Math.floor(rest / 60), s = rest % 60;
  $("y").textContent = y; $("mo").textContent = m; $("d").textContent = d;
  $("h").textContent = h; $("mi").textContent = mi; $("s").textContent = s;
}
tick(); setInterval(tick, 1000);
 
/* Música */
const audio = $("audio"), btn = $("music");
if (R.cancion){ audio.src = R.cancion; }
btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); };
audio.onplay = () => btn.classList.add("playing");
audio.onpause = () => btn.classList.remove("playing");
 
/* Abrir sobre */
let opened = false;
$("envelope").onclick = () => {
  if (opened) return; opened = true;
  $("envelope").classList.add("open");
  if (R.cancion){ btn.classList.add("show"); audio.play().catch(()=>{}); }
  setTimeout(() => { $("intro").classList.add("gone"); document.body.classList.remove("locked"); petals(18); }, 1700);
};
 
/* Aparecer al hacer scroll */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
}), {threshold:.2});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
 
/* Carta escrita a máquina */
let typed = false;
new IntersectionObserver((es, o) => es.forEach(e => {
  if (!e.isIntersecting || typed) return; typed = true; o.disconnect();
  const el = $("letterBody"), txt = R.carta; let i = 0;
  const caret = document.createElement("span"); caret.className = "caret";
  (function step(){
    el.textContent = txt.slice(0, i); el.appendChild(caret);
    if (i++ < txt.length){ const c = txt[i-1]; setTimeout(step, c === "\n" ? 220 : /[.,]/.test(c) ? 140 : 32); }
    else { caret.remove(); $("letterSign").classList.add("in"); petals(10); }
  })();
}), {threshold:.35}).observe($("letterBody"));
 
/* Pétalos */
function petals(n){
  for (let k = 0; k < n; k++){
    const p = document.createElement("div"); p.className = "petal";
    p.style.left = Math.random()*100 + "vw";
    p.style.setProperty("--dx", (Math.random()*160-80) + "px");
    p.style.animationDuration = (5 + Math.random()*5) + "s";
    p.style.animationDelay = (Math.random()*3) + "s";
    document.body.appendChild(p); setTimeout(() => p.remove(), 14000);
  }
}
</script>
</body>
</html>
